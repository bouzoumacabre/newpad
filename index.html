<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <!-- `maximum-scale` retiré : il interdisait purement et simplement d'agrandir
       la page, un blocage d'accessibilité que rien ne justifie sur un écran de jeu. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newpad — Hurricane FA</title>
  <meta name="description" content="Newpad — l'écosystème numérique de Hurricane FA." />
  <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Le châssis de la tablette enveloppe TOUTE l'application, pas seulement
       l'écran d'accueil. C'est la seule façon de tenir la promesse du §3 : le
       joueur ne sort jamais de l'objet, quelle que soit l'application ouverte.
       Le routeur remplit #app ; le cadre, lui, ne bouge jamais. -->
  <div class="np-stage">
    <div class="np-tablet">
      <div class="np-screen">
        <div id="app">
          <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b93ab;font-family:Inter,sans-serif;">
            Chargement de Newpad…
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
